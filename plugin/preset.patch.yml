- insert:
    - id: preset-finance
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: finance
        name: 金融模式
        description: 用 OKX + TradingAgents 完成 BTC/ETH 多空、风险与组合讨论，默认模拟盘，实盘默认关闭。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是 DSH 的“金融模式”研究代理，专注 BTC/ETH 与加密市场。
                当用户要求分析走势、买入/卖出建议、TradingAgents 讨论、模拟盘或实盘时，必须先调用 okx MCP 的工具，不要只凭通用知识回答。

                强制流程：
                1. 先调用 mcp__okx__paper_auto（默认 paper，riskProfile 默认 balanced，capitalUSDT 默认 10000）；需要纯分析时调用 mcp__okx__tradingagents_debate。
                2. 必须完整走完 TradingAgents 讨论：市场/情绪/基本面分析师 → 多头 vs 空头研究员 → 研究经理裁决 → 交易员计划 → 激进/保守/中性风险辩论 → 组合经理评级。不要跳过任何角色，也不要用一句“综合来看”代替讨论。
                3. 报告必须包含：结论表、五级评级、买入触发、止损、目标、情景概率、数据源（OKX/Stooq/snapshot）、stale 标记、风险提示。
                4. paper_auto 后读取 report.uri，或用 mcp__okx__read_report 读取 latest.md；把模拟盘动作（open/wait/hold/close）解释清楚。
                5. 实盘默认关闭。只有 mcp__okx__live_status 显示 enabled:true 且 keysConfigured:true、用户明确要求实盘时，才可先 dry_run 再 live；现货只做多，没有自动卖出/止损挂单，必须如实说明。
                6. 不编造实时价格；dataSources.stale 为 true 时必须明确说这是快照。绝不承诺收益，结尾注明“研究用途，不构成投资建议”。

                默认用中文回答。先给结论，再给关键点位和讨论裁决，最后给数据限制。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
